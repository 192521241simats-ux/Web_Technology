<!DOCTYPE html>
<html>
<head>
    <title>Scientific Calculator</title>

    <style>
        body {
            font-family: Arial;
            background-color: White;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculator {
            background-color: #222;
            padding: 20px;
            border-radius: 15px;
            width: 330px;
        }

        #display {
            width: 100%;
            height: 55px;
            font-size: 25px;
            text-align: right;
            margin-bottom: 15px;
            box-sizing: border-box;
            padding: 10px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            height: 50px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: lightgray;
        }

        .scientific {
            background-color: orange;
        }

        .equal {
            background-color: green;
            color: white;
        }

        .clear {
            background-color: red;
            color: white;
        }
    </style>
</head>

<body>

<div class="calculator">

    <input type="text" id="display" readonly>

    <div class="buttons">

        <button class="scientific" onclick="calculate('sin')">sin</button>
        <button class="scientific" onclick="calculate('cos')">cos</button>
        <button class="scientific" onclick="calculate('tan')">tan</button>
        <button class="scientific" onclick="calculate('sqrt')">√</button>

        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button onclick="appendValue('/')">/</button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button onclick="appendValue('*')">*</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button onclick="appendValue('-')">-</button>

        <button onclick="appendValue('0')">0</button>
        <button onclick="appendValue('.')">.</button>
        <button class="equal" onclick="calculate('equal')">=</button>
        <button onclick="appendValue('+')">+</button>

        <button onclick="appendValue('(')">(</button>
        <button onclick="appendValue(')')">)</button>
        <button class="scientific" onclick="calculate('log')">log</button>
        <button class="clear" onclick="clearDisplay()">C</button>

    </div>
</div>

<script>

    function appendValue(value) {
        document.getElementById("display").value += value;
    }

    function clearDisplay() {
        document.getElementById("display").value = "";
    }

    function calculate(operation) {

        let display = document.getElementById("display");
        let value = display.value;

        try {

            if (operation === "sin") {
                display.value = Math.sin(value * Math.PI / 180);
            }

            else if (operation === "cos") {
                display.value = Math.cos(value * Math.PI / 180);
            }

            else if (operation === "tan") {
                display.value = Math.tan(value * Math.PI / 180);
            }

            else if (operation === "sqrt") {
                display.value = Math.sqrt(value);
            }

            else if (operation === "log") {
                display.value = Math.log10(value);
            }

            else if (operation === "equal") {
                display.value = eval(value);
            }

        } catch (error) {
            display.value = "Error";
        }
    }

</script>

</body>
</html>
