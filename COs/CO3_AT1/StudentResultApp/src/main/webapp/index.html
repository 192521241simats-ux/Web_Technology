<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Student Result Processing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background: darkgreen;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Student Result Processing</h2>

        <form action="result" method="post">
            <label>Name</label>
            <input type="text" name="name" placeholder="Enter student name" required>

            <label>Register Number</label>
            <input type="text" name="regno" placeholder="Enter register number" required>

            <label>Subject 1 Mark</label>
            <input type="number" name="mark1" min="0" max="100" placeholder="Enter mark" required>

            <label>Subject 2 Mark</label>
            <input type="number" name="mark2" min="0" max="100" placeholder="Enter mark" required>

            <label>Subject 3 Mark</label>
            <input type="number" name="mark3" min="0" max="100" placeholder="Enter mark" required>

            <input type="submit" value="Calculate Result">
        </form>
    </div>
</body>
</html>
